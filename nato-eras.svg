<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">NATO 1.0 to NATO 3.0: a transition graphic</title><desc id="desc">Three stages from 1949 to today: collective defence, post-Cold War adaptation, and the current Europe-led conventional defence debate.</desc><rect width="1200" height="310" fill="#0d1521"/><g font-family="Arial, sans-serif"><text x="54" y="48" fill="#d4a848" font-size="15" font-weight="700" letter-spacing="3">NATOLINKS · THE TRANSITION</text><line x1="70" y1="165" x2="1130" y2="165" stroke="#536070" stroke-width="3"/><circle cx="110" cy="165" r="11" fill="#d4a848"/><circle cx="520" cy="165" r="11" fill="#d4a848"/><circle cx="875" cy="165" r="11" fill="#d4a848"/><circle cx="1110" cy="165" r="11" fill="#d4a848"/><text x="92" y="204" fill="#aeb8c5" font-size="14">1949</text><text x="501" y="204" fill="#aeb8c5" font-size="14">1991</text><text x="856" y="204" fill="#aeb8c5" font-size="14">2025</text><text x="1075" y="204" fill="#aeb8c5" font-size="14">NOW</text><text x="70" y="95" fill="#f4f6f8" font-size="28" font-weight="700">NATO 1.0</text><text x="70" y="122" fill="#b9c2cd" font-size="17">1949–1991 · collective defence built for war</text><text x="446" y="95" fill="#f4f6f8" font-size="28" font-weight="700">NATO 2.0</text><text x="446" y="122" fill="#b9c2cd" font-size="17">1991–2025 · expansion, missions, dependency</text><text x="815" y="95" fill="#f4f6f8" font-size="28" font-weight="700">NATO 3.0</text><text x="815" y="122" fill="#b9c2cd" font-size="17">2025 onward · Europe leads conventionally</text><text x="70" y="258" fill="#d4a848" font-size="16" font-weight="700">QUESTION</text><text x="70" y="284" fill="#e7ebf0" font-size="18">Can Europe be defended?</text><text x="446" y="258" fill="#d4a848" font-size="16" font-weight="700">QUESTION</text><text x="446" y="284" fill="#e7ebf0" font-size="18">Who carries the load?</text><text x="815" y="258" fill="#d4a848" font-size="16" font-weight="700">QUESTION</text><text x="815" y="284" fill="#e7ebf0" font-size="18">Can capability arrive in time?</text></g>
</svg>
